[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-filler"
version = "2.1.0"
description = "Parse a resume and pre-fill online job applications for human review."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
keywords = ["resume", "job-application", "ats", "automation", "selenium"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Office/Business",
]
dependencies = [
    "selenium>=4.20.0,<5.0.0",
    "pdfplumber>=0.11.0,<1.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "requests>=2.32.0,<3.0.0",
]

# Deliberately no author email. Package metadata is published permanently and
# indexed widely, so the repository is the right place to be contacted through.
[project.urls]
Homepage = "https://github.com/Core-Creates/Resume-Filler"
Repository = "https://github.com/Core-Creates/Resume-Filler"
Issues = "https://github.com/Core-Creates/Resume-Filler/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=5.0.0,<7.0.0",
    "ruff>=0.6.0,<1.0.0",
    "mypy>=1.11.0,<2.0.0",
    "types-requests>=2.32.0",
]

[project.scripts]
resume-filler = "resume_filler.cli:main"

[tool.setuptools.packages.find]
include = ["resume_filler*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "BLE", "RET"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Make the repo root importable so a bare `pytest` works without an editable
# install. Without this, only `python -m pytest` succeeds, because that form
# puts the working directory on sys.path and the bare entry point does not.
pythonpath = ["."]
