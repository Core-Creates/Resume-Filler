<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>My Information</title></head>
<body>
<!--
  A Workday-style multi-step wizard, step 1 of 3. Characteristic traits:
   - generated data-automation-id attributes instead of meaningful name/id
   - the visible label is the only usable signal
   - "Country" is a scripted combobox built from divs, not a <select>
   - the step advances with "Save and Continue", never "Submit"
-->
<form data-automation-id="applicationForm">
  <h2>My Information</h2>
  <p class="progress">Step 1 of 3</p>

  <div class="field">
    <label for="input-1">Legal Name: First Name</label>
    <input type="text" id="input-1" data-automation-id="legalNameSection_firstName" required>
  </div>

  <div class="field">
    <label for="input-2">Legal Name: Last Name</label>
    <input type="text" id="input-2" data-automation-id="legalNameSection_lastName" required>
  </div>

  <div class="field">
    <label for="input-3">Email Address</label>
    <input type="text" id="input-3" data-automation-id="email" required>
  </div>

  <div class="field">
    <label for="input-4">Phone Number</label>
    <input type="text" id="input-4" data-automation-id="phone-number">
  </div>

  <div class="field">
    <label id="lbl-country">Country</label>
    <div role="combobox" aria-labelledby="lbl-country" aria-haspopup="listbox"
         data-automation-id="countryDropdown" tabindex="0">Select One</div>
    <ul role="listbox" hidden>
      <li role="option">Canada</li>
      <li role="option">United States</li>
      <li role="option">United Kingdom</li>
    </ul>
  </div>

  <div class="field">
    <label for="input-5">Address Line 1</label>
    <input type="text" id="input-5" data-automation-id="addressSection_addressLine1">
  </div>

  <div class="field">
    <label for="input-6">City</label>
    <input type="text" id="input-6" data-automation-id="addressSection_city">
  </div>

  <button type="button" data-automation-id="bottom-navigation-next-button">Save and Continue</button>
</form>
</body>
</html>
