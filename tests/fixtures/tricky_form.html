<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Application</title></head>
<body>
<!--
  Every control on this page is a case that naive matching gets wrong:
   - "Confirm Email Address" must not be treated as the primary email
   - "Company Name" must not be treated as the applicant's name
   - "Title" here is a salutation, not a job title
   - "Country Code" must not be treated as the phone number
   - "Address Line 2" must not be treated as the street address
   - labels are associated by aria-labelledby and by wrapping, not just for=
-->
<form>
  <h2 id="section-contact">Contact details</h2>

  <p><span id="lbl-name">Full Name</span>
     <input type="text" name="applicant" aria-labelledby="lbl-name"></p>

  <p><label>Email Address <input type="text" name="e1"></label></p>
  <p><label>Confirm Email Address <input type="text" name="e2"></label></p>

  <p><label for="ccode">Country Code</label>
     <input type="text" id="ccode" name="ccode"></p>
  <p><label for="mobile">Mobile Number</label>
     <input type="text" id="mobile" name="mobile"></p>

  <p><label for="salutation">Title</label>
     <select id="salutation" name="salutation">
       <option>Mr</option><option>Ms</option><option>Mx</option><option>Dr</option>
     </select></p>

  <p><label for="addr1">Address Line 1</label>
     <input type="text" id="addr1" name="addr1"></p>
  <p><label for="addr2">Address Line 2</label>
     <input type="text" id="addr2" name="addr2"></p>
  <p><label for="town">Town/City</label>
     <input type="text" id="town" name="town"></p>
  <p><label for="pc">Postcode</label>
     <input type="text" id="pc" name="pc"></p>

  <h2>Employment</h2>
  <p><label for="co">Company Name</label>
     <input type="text" id="co" name="co"></p>
  <p><label for="jt">Job Title</label>
     <input type="text" id="jt" name="jt"></p>
  <p><label for="yoe">Years of Experience</label>
     <input type="number" id="yoe" name="yoe"></p>

  <h2>Education</h2>
  <p><label for="uni">University</label>
     <input type="text" id="uni" name="uni"></p>
  <p><label for="deg">Degree</label>
     <input type="text" id="deg" name="deg"></p>
  <p><label for="fos">Field of Study</label>
     <input type="text" id="fos" name="fos"></p>

  <h2>Other</h2>
  <p><label for="sal">Desired Salary</label>
     <input type="text" id="sal" name="sal"></p>
  <p><label for="why">Why do you want to work here?</label>
     <textarea id="why" name="why" rows="6"></textarea></p>
  <p><label for="ref">Reference Name</label>
     <input type="text" id="ref" name="ref"></p>

  <input type="hidden" name="csrf" value="x">
  <button type="submit">Send Application</button>
</form>
</body>
</html>
