<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply: Senior Software Engineer</title></head>
<body>
<main id="main">
  <h1>Apply for Senior Software Engineer</h1>
  <form id="application_form" method="post" enctype="multipart/form-data">

    <div class="field">
      <label for="first_name">First Name <span class="req">*</span></label>
      <input type="text" name="job_application[first_name]" id="first_name" autocomplete="given-name" required>
    </div>

    <div class="field">
      <label for="last_name">Last Name <span class="req">*</span></label>
      <input type="text" name="job_application[last_name]" id="last_name" autocomplete="family-name" required>
    </div>

    <div class="field">
      <label for="email">Email <span class="req">*</span></label>
      <input type="email" name="job_application[email]" id="email" autocomplete="email" required>
    </div>

    <div class="field">
      <label for="phone">Phone</label>
      <input type="tel" name="job_application[phone]" id="phone" autocomplete="tel">
    </div>

    <div class="field">
      <label for="resume">Resume/CV <span class="req">*</span></label>
      <input type="file" name="job_application[resume]" id="resume" required>
    </div>

    <div class="field">
      <label for="cover_letter">Cover Letter</label>
      <input type="file" name="job_application[cover_letter]" id="cover_letter">
    </div>

    <div class="field">
      <label for="question_12345">LinkedIn Profile</label>
      <input type="text" name="job_application[answers_attributes][0][text_value]" id="question_12345">
    </div>

    <div class="field">
      <label for="question_12346">Website</label>
      <input type="text" name="job_application[answers_attributes][1][text_value]" id="question_12346">
    </div>

    <div class="field">
      <label for="question_12347">Current Company</label>
      <input type="text" name="job_application[answers_attributes][2][text_value]" id="question_12347">
    </div>

    <div class="field">
      <label for="question_12348">How did you hear about this job?</label>
      <select name="job_application[answers_attributes][3][text_value]" id="question_12348">
        <option value="">Please select</option>
        <option>LinkedIn</option>
        <option>Referral</option>
        <option>Company Website</option>
      </select>
    </div>

    <fieldset>
      <legend>Are you legally authorized to work in the United States?</legend>
      <label><input type="radio" name="work_auth" value="yes"> Yes</label>
      <label><input type="radio" name="work_auth" value="no"> No</label>
    </fieldset>

    <fieldset>
      <legend>Will you now or in the future require sponsorship?</legend>
      <label><input type="radio" name="sponsorship" value="yes"> Yes</label>
      <label><input type="radio" name="sponsorship" value="no"> No</label>
    </fieldset>

    <div class="field">
      <label for="gender">Gender</label>
      <select name="demographic[gender]" id="gender">
        <option value="">Decline to self identify</option>
        <option>Male</option>
        <option>Female</option>
      </select>
    </div>

    <div class="field">
      <label for="veteran_status">Veteran Status</label>
      <select name="demographic[veteran]" id="veteran_status">
        <option value="">Decline to self identify</option>
        <option>I am not a protected veteran</option>
      </select>
    </div>

    <input type="hidden" name="authenticity_token" value="abc123">
    <button type="submit" id="submit_app">Submit Application</button>
  </form>
</main>
</body>
</html>
